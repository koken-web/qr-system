name: Deploy new apps at existing URLs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hosting configuration and retained legacy source
        uses: actions/checkout@v4
      - name: Checkout reviewed new application source
        uses: actions/checkout@v4
        with:
          repository: 1453manamana5-web/QR-Ticket-System
          ref: 5655ea0602e6b855b9f9472a6f8339fb01c5183a
          path: next-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure the existing new-app Firebase client
        run: node deployment/configure-client.mjs
      - name: Offline startup regression tests
        run: node --test deployment/offline/service-worker.test.mjs
      - name: Install new application dependencies
        working-directory: next-app
        run: npm install
      - name: Client regression tests
        working-directory: next-app
        run: npm run test:client
      - name: Build reception at original URL
        working-directory: next-app
        run: npm run build --workspace reception-app -- --base=/qr-system/
      - name: Build management at original control URL
        working-directory: next-app
        run: npm run build --workspace management-app -- --base=/qr-system/control/
      - name: Assemble and verify both entry points and PWA files
        run: python3 deployment/prepare-pages.py
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to the original URLs
        id: deployment
        uses: actions/deploy-pages@v4
